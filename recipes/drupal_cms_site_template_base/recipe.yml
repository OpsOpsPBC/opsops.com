name: Drupal CMS Basics
description: 'Provides the foundational features of Drupal CMS.'
recipes:
  - core/recipes/administrator_role
  - core/recipes/content_editor_role
  - core/recipes/core_recommended_maintenance
  - core/recipes/core_recommended_performance
  - core/recipes/document_media_type
  - core/recipes/image_media_type
  - core/recipes/local_video_media_type
  - core/recipes/remote_video_media_type
  - core/recipes/user_picture
  - easy_email_express

install:
  - announcements_feed
  - automatic_updates
  - autosave_form
  - canvas
  - canvas_page_template_component
  - coffee
  - contextual
  - dashboard
  - dblog
  - drupal_cms_helper
  - drupical
  - easy_breadcrumb
  - eca_base
  - eca_config
  - eca_content
  - eca_form
  - eca_misc
  - eca_render
  - eca_ui
  - eca_user
  - field_group
  - field_ui
  - file
  - focal_point
  - gin
  - gin_login
  - gin_toolbar
  - klaro
  - linkit
  - login_emailusername
  - media_file_delete
  - media_library_bulk_upload
  - menu_link_attributes
  - menu_link_content
  - menu_ui
  - metatag
  - metatag_open_graph
  - metatag_twitter_cards
  - modeler
  - navigation
  - navigation_extra_tools
  - node
  - options
  - pathauto
  - project_browser
  # Although this specific recipe is not multilingual, this module allows the resulting
  # site to become multilingual in the future.
  - recipe_locale
  - redirect
  - redirect_404
  - responsive_image
  - sam
  - scheduler
  - scheduler_content_moderation_integration
  - seo_checklist
  - simple_sitemap
  - svg_image
  - tagify
  - tagify_user_list
  - taxonomy
  - token_or
  - trash
  - update
  - views
  - views_ui
  - view_password
  - workflows
  - yoast_seo
  # This theme MUST be installed or Canvas breaks in strange ways.
  - canvas_stark
  # By default, Drupal installs Stark as the default theme. It must be listed here, at
  # least initially, to prevent bugs if it's not present. You can remove it later if you
  # want to; just uninstall it before exporting the site as a recipe.
  - stark

config:
  strict:
    # Treat field storages strictly since they influence the database layout.
    - field.storage.media.field_media_svg_image
    - field.storage.node.field_content
    - field.storage.node.field_description
    - field.storage.node.field_featured_image
    - field.storage.node.field_tags
    - field.storage.node.field_seo_analysis
    - field.storage.node.field_seo_description
    - field.storage.node.field_seo_image
    - field.storage.node.field_seo_title
    - pathauto.pattern.menu_path

  import:
    canvas: '*'
    claro:
      - block.block.claro_breadcrumbs
      - block.block.claro_content
      - block.block.claro_local_actions
      - block.block.claro_messages
      - block.block.claro_page_title
      - block.block.claro_primary_local_tasks
      - block.block.claro_secondary_local_tasks
    filter: '*'
    focal_point: '*'
    gin:
      - block.block.gin_breadcrumbs
      - block.block.gin_content
      - block.block.gin_local_actions
      - block.block.gin_messages
      - block.block.gin_page_title
      - block.block.gin_primary_local_tasks
      - block.block.gin_secondary_local_tasks
    klaro: '*'
    linkit:
      - image.style.linkit_result_thumbnail
    metatag:
      # Exclude Global, Front and Node as we create those in the config folder.
      - metatag.metatag_defaults.403.yml
      - metatag.metatag_defaults.404.yml
      - metatag.metatag_defaults.taxonomy_term.yml
      - metatag.metatag_defaults.user.yml
    navigation:
      - system.menu.content
      - system.menu.navigation-user-links
    node:
      # Only import config which is also imported by the Standard profile.
      - core.entity_view_mode.node.full
      - core.entity_view_mode.node.rss
      - core.entity_view_mode.node.teaser
      - system.action.node_delete_action
      - system.action.node_make_sticky_action
      - system.action.node_make_unsticky_action
      - system.action.node_promote_action
      - system.action.node_publish_action
      - system.action.node_save_action
      - system.action.node_unpromote_action
      - system.action.node_unpublish_action
      - views.view.content
    redirect:
      - system.action.redirect_delete_action
    redirect_404: '*'
    scheduler: '*'
    scheduler_content_moderation_integration: '*'
    simple_sitemap: '*'
    system:
      - system.menu.footer
    taxonomy: '*'
    trash: '*'
    user:
      - views.view.user_admin_people

  actions:
    # Don't show more than 2 announcements.
    announcements_feed.settings:
      simpleConfigUpdate:
        limit: 2

    # Enable core updates in the UI.
    automatic_updates.settings:
      simpleConfigUpdate:
        allow_core_minor_updates: true

    # Enable autosave for all content types.
    autosave_form.settings:
      simpleConfigUpdate:
        allowed_content_entity_types:
          node:
            bundles: []

    # Show the Name field, and hide the URL alias field, on all media forms.
    core.entity_form_display.media.*.*:
      setComponent:
        name: name
        options:
          type: string_textfield
          weight: -5
      hideComponent: path

    # Use Focal Point for all image media forms.
    core.entity_form_display.media.image.*:
      setComponent:
        name: field_media_image
        options:
          type: image_focal_point
          weight: 1
          settings:
            progress_indicator: throbber
            preview_image_style: media_library
            preview_link: true
            offsets: '50,50'

    # Use a square thumbnail for all image media items in the media library.
    core.entity_view_display.media.image.media_library:
      setComponent:
        name: thumbnail
        options:
          settings:
            image_style: media_library_square_thumbnail

    # Show avatars wherever user accounts are displayed.
    core.entity_view_display.user.user.*:
      setComponent:
        name: user_picture
        options:
          type: image
          label: hidden
          weight: 0
          settings:
            image_style: thumbnail
            image_link: content
            image_loading:
              attribute: lazy
            svg_attributes:
              width: 72
              height: 72
            svg_render_as_image: false

    # Disable the link to the announcements feed; we already show it on
    # the dashboard.
    core.menu.static_menu_link_overrides:
      overrideMenuLinks:
        announcements_feed.announcement:
          enabled: false

    easy_breadcrumb.settings:
      simpleConfigUpdate:
        # Don't add current page in admin UI.
        applies_admin_routes: false
        # Add Schema.org Breadcrumb markup.
        add_structured_data_json_ld: true
        # Remove breadcrumbs when only home appears.
        # Since we print the page title in the crumb, this is only applies to the home page.
        hide_single_home_item: true
        # Don't alter the capitalization of breadcrumbs.
        capitalizator_mode: none

    # Set a default user avatar, and ensure they are uploaded into a specific directory.
    field.field.user.user.user_picture:
      setSettings:
        file_directory: avatars
        min_resolution: 72x72
      # A custom config action defined by Drupal CMS Helper.
      setDefaultImage: abcfbf7d-0cf1-4e24-b361-30bb3f7e5b39

    file.settings:
      simpleConfigUpdate:
        filename_sanitization.replace_whitespace: true

    # Set the wallpaper for the login forms.
    gin_login.settings:
      simpleConfigUpdate:
        brand_image:
          use_default: false
          # This is placed by the file entity that ships with this recipe.
          # @see content/file/abcfbf7d-0cf1-4e24-b361-30bb3f7e5b39.yml
          path: public://login-wallpaper.png

    klaro.klaro_app.cms:
      setProperties:
        label: 'Drupal CMS'

    # These two apps will be automatically enabled when a video media item is
    # created.
    klaro.klaro_app.vimeo:
      disable: []
    klaro.klaro_app.youtube:
      disable: []

    klaro.settings:
      simpleConfigUpdate:
        auto_decorate_final_html: true
        library.group_by_purpose: true

    # An empty privacy policy is shipped with this recipe.
    # @see content/node/00d105b3-6f05-40c6-a289-3dd61c89480e.yml
    klaro.texts:
      simpleConfigUpdate:
        consentModal.privacyPolicy.url: 'internal:/privacy-policy'

    menu_link_attributes.config:
      simpleConfigUpdate:
        attributes.rel:
          label: Relationship
          description: 'The "rel" attribute specifies the relationship between the current document and the linked document.'

    navigation.block_layout:
      # To prevent duplicated items if this recipe is applied more than once,
      # this needs to be changed as simple config. That's okay, though, because
      # even though Navigation treats this as a layout section, it's still just
      # a simple config object at heart.
      simpleConfigUpdate:
        # Replace the Shortcuts block with the Dashboard. (The UUID is from
        # navigation.block_layout.yml.)
        sections.0.components.2622e40b-8786-4b8c-8883-19e49da53023:
          uuid: 2622e40b-8786-4b8c-8883-19e49da53023
          region: content
          configuration:
            id: navigation_dashboard
            label: Dashboard
            label_display: '0'
            provider: dashboard
          weight: 0
          additional: []
        # Add a link to the Drupal CMS user guide.
        sections.0.components.52e884dd-0301-4265-b2b3-9cea53a403f3:
          uuid: 52e884dd-0301-4265-b2b3-9cea53a403f3
          region: footer
          configuration:
            id: navigation_link
            label: Help
            label_display: '0'
            provider: navigation
            title: Help
            uri: 'https://project.pages.drupalcode.org/drupal_cms'
            icon_class: help
          weight: -2
          additional: []

    project_browser.admin_settings:
      simpleConfigUpdate:
        enabled_sources:
          drupalorg_jsonapi: []
        allow_ui_install: true
        max_selections: 1

    redirect_404.settings:
      simpleConfigUpdate:
        suppress_404: true

    scheduler.settings:
      simpleConfigUpdate:
        hide_seconds: true

    system.site:
      simpleConfigUpdate:
        page.403: '/user/login'

    system.theme:
      simpleConfigUpdate:
        admin: gin

    tagify.settings:
      simpleConfigUpdate:
        set_default_widget: true

    trash.settings:
      simpleConfigUpdate:
        enabled_entity_types.node: []
        enabled_entity_types.canvas_page: []

    user.role.anonymous:
      grantPermissions:
        # We assume all published content should be accessible to anonymous users.
        - 'access content'
        - 'use klaro'
        - 'view media'

    # We don't grant dashboard access to regular authenticated users, because by
    # default it has nothing for them to do.
    user.role.authenticated:
      grantPermissions:
        - 'access administration pages'
        - 'access coffee'
        - 'access content'
        - 'access contextual links'
        - 'access navigation'
        - 'delete own files'
        - 'use klaro'
        - 'view media'
        - 'view own unpublished content'
        - 'view the administration theme'

    user.role.content_editor:
      grantPermissions:
        - 'access content overview'
        - 'access media overview'
        - 'access trash'
        - 'administer menu'
        - 'administer redirects'
        - 'administer url aliases'
        - 'create canvas_page'
        - 'create url aliases'
        - 'create video media'
        - 'delete canvas_page'
        - 'delete page revisions'
        - 'edit canvas_page'
        - 'revert all revisions'
        - 'schedule publishing of nodes'
        - 'use basic_editorial transition unpublish'
        - 'use basic_editorial transition create_new_draft'
        - 'use basic_editorial transition publish'
        - 'use media document bulk upload form'
        - 'use media image bulk upload form'
        - 'use media remote_video bulk upload form'
        - 'use media svg_image bulk upload form'
        - 'use media video bulk upload form'
        - 'use text format content_format'
        - 'view all revisions'
        - 'view any unpublished content'
        - 'view own unpublished media'
        - 'view scheduled content'
        - 'view welcome dashboard'
      grantPermissionsForEachNodeType:
        - 'create %bundle content'
        - 'delete any %bundle content'
        - 'edit any %bundle content'
      grantPermissionsForEachMediaType:
        - 'create %bundle media'
        - 'delete any %bundle media'
        - 'edit any %bundle media'

    # By default, don't allow random visitors to create accounts.
    user.settings:
      simpleConfigUpdate:
        register: admin_only

    # Disable the `files` view because it is not clear to most users what the
    # difference is between "Files" and "Media". We favor media.
    views.view.files:
      disable: {}

    # Disable the taxonomy and media scheduler views because they are not
    # needed and break the navigation menu.
    views.view.scheduler_scheduled_media:
      disable: {}
    views.view.scheduler_scheduled_taxonomy_term:
      disable: {}

    # Disable Canvas components that aren't really useful in building pages or
    # content templates. This doesn't delete the components; it only prevents
    # them from appearing in the Canvas UI. If you want any of these components
    # to be enabled by default, delete them from this list.
    ?canvas.component.block.announce_block:
      disable: []
    ?canvas.component.block.dashboard_placeholder:
      disable: []
    ?canvas.component.block.dashboard_site_status:
      disable: []
    canvas.component.block.local_actions_block:
      disable: []
    canvas.component.block.local_tasks_block:
      disable: []
    ?canvas.component.block.navigation_dashboard:
      disable: []
    ?canvas.component.block.navigation_link:
      disable: []
    ?canvas.component.block.navigation_shortcuts:
      disable: []
    ?canvas.component.block.navigation_user:
      disable: []
    canvas.component.block.project_browser_block.*:
      disable: []
    ?canvas.component.block.system_menu_block.admin:
      disable: []
    ?canvas.component.block.system_menu_block.navigation-user-links:
      disable: []
    ?canvas.component.block.system_menu_block.tools:
      disable: []
    ?canvas.component.block.system_menu_block.top-tasks:
      disable: []
    canvas.component.block.system_messages_block:
      disable: []
    ?canvas.component.block.views_block.publishing_content-block_drafts:
      disable: []
    ?canvas.component.block.views_block.publishing_content-block_scheduled:
      disable: []
    ?canvas.component.block.views_block.recent_pages-block_recent_pages:
      disable: []
    ?canvas.component.sdc.navigation.title:
      disable: []
    ?canvas.component.block.events_block:
      disable: []
