name: 'Forma'
description: 'Designed for a portfolio site, this template features a warm and modern earthy design, along with articles and a project portfolio.'
type: Site
recipes:
  - drupal_cms_site_template_base
  - drupal_cms_forms
install:
  - ui_icons
  - ui_icons_field
  - ui_icons_menu
  - ui_icons_picker
  - forma_theme
config:
  strict: false
  actions:
    gin_login.settings:
      simpleConfigUpdate:
        brand_image.path: 'public://nick-hillier-aQcE3gDSSTY-unsplash_0.jpg'
    node.type.page:
      setPreviewMode: 0
    project_browser.admin_settings:
      simpleConfigUpdate:
        enabled_sources:
          recommended:
            uri: 'https://git.drupalcode.org/api/v4/projects/221152/repository/files/recommended.yml/raw?ref=HEAD'
            ttl: 86400
          drupalorg_jsonapi: { }
    system.site:
      simpleConfigUpdate:
        page:
          403: /user/login
          404: /page/2
          front: /home
    system.theme:
      simpleConfigUpdate:
        default: forma_theme
    user.role.content_editor:
      grantPermissions:
        - create article content
        - create project content
        - edit any article content
        - edit any project content
        - delete any article content
        - delete any project content
    workflows.workflow.basic_editorial:
      addNodeTypes:
        - article
        - project

    canvas.component.theme_page_template.forma_theme:
      createIfNotExists:
        label: 'Forma page template'
        provider: canvas_page_template_component
        source: theme_page_template
        source_local_id: forma_theme
        active_version: 15fe1e06320b1035
        versioned_properties:
          active:
            settings: { }
            fallback_metadata:
              slot_definitions:
                content:
                  title: Content
                  description: 'The Content region.'
                  examples:
                    - ''
                header:
                  title: Header
                  description: 'The Header region.'
                  examples:
                    - ''
                footer:
                  title: Footer
                  description: 'The Footer region.'
                  examples:
                    - ''

